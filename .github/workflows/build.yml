      - name: P0 preflight Soong R8/D8 and BuildBuddy default pool
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          REPORT=/tmp/rbe-test/java-rbe-source-preflight.txt
          exec > >(tee "$REPORT") 2>&1
          echo "P0 java_rbe_mode=${JAVA_RBE_MODE}"
          case "$JAVA_RBE_MODE" in
            off)
              echo 'RBE_R8=false' >> "$GITHUB_ENV"
              echo 'RBE_D8=false' >> "$GITHUB_ENV"
              echo 'RBE_JAVAC=false' >> "$GITHUB_ENV"
              echo 'P0 disabled. Original R8/D8 local build retained.'
              exit 0 ;;
            dex) ;;
            *) echo '::error::Unsupported JAVA_RBE_MODE'; exit 1 ;;
          esac

          DEX=build/soong/java/dex.go
          CONFIG=build/soong/java/config/config.go
          REMOTE=build/soong/remoteexec/remoteexec.go
          test -s "$DEX" && test -s "$CONFIG" && test -s "$REMOTE"
          python3 - "$DEX" "$CONFIG" "$REMOTE" <<'P0SOURCE'
          from pathlib import Path
          import re, sys
          dex, config, remote = (Path(p) for p in sys.argv[1:])
          d, c, r = dex.read_text(), config.read_text(), remote.read_text()
          for feature in ('RBE_R8', 'RBE_D8'):
              if not re.search(r'IsEnvTrue\("'+feature+r'"\)', d):
                  raise SystemExit('P0 source missing active gate: '+feature)
          for rule in ('r8RE', 'd8RE'):
              if not re.search(r'\b'+rule+r'\b', d):
                  raise SystemExit('P0 source missing remote dex rule: '+rule)
          for strategy in ('RBE_R8_EXEC_STRATEGY', 'RBE_D8_EXEC_STRATEGY'):
              if strategy not in c:
                  raise SystemExit('P0 source missing remote strategy: '+strategy)
          if 'UseREWrapper()' not in d and 'UseRBE()' not in d:
              raise SystemExit('P0 source has no RBE selection gate')
          if 'if v == ""' not in r and 'if v == "" {' not in r:
              raise SystemExit('P0 cannot verify empty Pool property suppression')

          # AOSP java16 pool is not provided by BuildBuddy by default.
          # StaticVariableWithEnvOverride resolves empty environment to its fallback,
          # so setting RBE_JAVA_POOL="" would NOT remove Pool=java16.
          # Change only the fallback to empty: remoteexec omits the Pool key.
          old = 'pctx.StaticVariableWithEnvOverride("REJavaPool", "RBE_JAVA_POOL", "java16")'
          new = 'pctx.StaticVariableWithEnvOverride("REJavaPool", "RBE_JAVA_POOL", "")'
          if c.count(old) != 1:
              raise SystemExit('P0 unexpected Java pool source; no speculative patch applied')
          if 'RBE_JAVA_POOL' in __import__('os').environ and __import__('os').environ['RBE_JAVA_POOL']:
              raise SystemExit('P0 non-empty RBE_JAVA_POOL would override default BuildBuddy pool')
          config.write_text(c.replace(old, new, 1))
          print('Verified remote R8/D8 selection and exec strategy. Javac intentionally local.')
          print('Patched only REJavaPool fallback: java16 -> empty (BuildBuddy default pool).')
          print('Remote Java actions retain the source-defined Android container-image.')
          P0SOURCE

          git -C build/soong diff -- java/config/config.go | head -80
          echo 'RBE_R8=1' >> "$GITHUB_ENV"
          echo 'RBE_D8=1' >> "$GITHUB_ENV"
          echo 'RBE_JAVAC=false' >> "$GITHUB_ENV"
          echo 'P0 source preflight PASS. R8/D8 enabled for graph generation.'

      - name: Route only two Sonivox ARM assembly actions around RBE scanner
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RBE_DIR:-}"
          WRAPPER="$RBE_DIR/rewrapper"
          REAL="$RBE_DIR/rewrapper.remote-original"
          test -x "$WRAPPER"
          test ! -e "$REAL"
          mv -- "$WRAPPER" "$REAL"
          cat > "$WRAPPER" <<'SONIVOX_REWRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          SELF_DIR="$(cd -- "$(dirname -- "$0")" && pwd -P)"
          REAL="$SELF_DIR/rewrapper.remote-original"
          matched=''
          for arg in "$@"; do
            case "$arg" in
              external/sonivox/arm-wt-22k/lib_src/ARM-E_filter_gnu.s|*/external/sonivox/arm-wt-22k/lib_src/ARM-E_filter_gnu.s)
                matched=ARM-E_filter_gnu.s ;;
              external/sonivox/arm-wt-22k/lib_src/ARM-E_mastergain_gnu.s|*/external/sonivox/arm-wt-22k/lib_src/ARM-E_mastergain_gnu.s)
                matched=ARM-E_mastergain_gnu.s ;;
            esac
          done
          if [[ -z "$matched" ]]; then
            exec "$REAL" "$@"
          fi
          argv=("$@")
          idx=0
          while (( idx < ${#argv[@]} )); do
            case "${argv[$idx]}" in
              prebuilts/clang/host/linux-x86/*/bin/clang|prebuilts/clang/host/linux-x86/*/bin/clang++)
                break ;;
            esac
            idx=$((idx + 1))
          done
          if (( idx >= ${#argv[@]} )); then
            echo "SONIVOX_ASM_LOCAL_ERROR no pinned clang command found: $matched" >&2
            exit 86
          fi
          compiler="${argv[$idx]}"
          if [[ ! -x "$compiler" ]]; then
            echo "SONIVOX_ASM_LOCAL_ERROR compiler not executable: $compiler" >&2
            exit 86
          fi
          printf '%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$matched" "$compiler" \
            >> /tmp/rbe-test/sonivox-local-assembly.tsv
          exec "${argv[@]:idx}"
          SONIVOX_REWRAPPER
          chmod 0755 "$WRAPPER"
          test -x "$REAL"
          test -x "$WRAPPER"

