      - name: Provide dummy GKI, Trusty and vmlinux filegroups dynamically
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          
          # 1. Khôi phục các file Android.bp bị xóa lỗi nếu đã chạy job trước đó
