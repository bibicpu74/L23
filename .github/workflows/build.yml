      - name: P1 reclaim unused Darwin binaries and historical VNDK ABI worktrees
        if: success()
        working-directory: /home/runner/work/los
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          REPORT=/tmp/rbe-test/storage-trim-p1.log
          TABLE=/tmp/rbe-test/storage-trim-p1.tsv
          TS=/tmp/rbe-test/resource-samples.tsv
          mkdir -p /tmp/rbe-test
          printf 'path\tpre_kib\tstatus\n' > "$TABLE"
          exec > >(tee "$REPORT") 2>&1

          echo '=== P1 STORAGE TRIM (WORKTREE ONLY) ==='
          echo "Darwin trimming: ${STORAGE_TRIM_DARWIN_HOST_TOOLS}"
          echo "Historical VNDK ABI trimming: ${STORAGE_TRIM_OLD_VNDK_ABI}"
          before_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          echo "disk_available_before_bytes=$before_bytes"

          trim_known_path() {
            local rel="$1" kib=0
            case "$rel" in
              prebuilts/rust/darwin-x86|prebuilts/clang-tools/darwin-x86|prebuilts/build-tools/darwin-x86|\
              prebuilts/jdk/jdk8/darwin-x86|prebuilts/jdk/jdk9/darwin-x86|\
              prebuilts/jdk/jdk11/darwin-x86|prebuilts/jdk/jdk17/darwin-x86|prebuilts/jdk/jdk21/darwin-x86|\
              prebuilts/abi-dumps/vndk/29|prebuilts/abi-dumps/vndk/30|prebuilts/abi-dumps/vndk/31|prebuilts/abi-dumps/vndk/32)
                ;;
              *) echo "::error::Refusing non-whitelisted removal: $rel"; return 2 ;;
            esac
            if [ -L "$rel" ]; then
              echo "SKIP symlink $rel"
              printf '%s\t0\tskipped-symlink\n' "$rel" >> "$TABLE"
              return 0
            fi
            if [ ! -d "$rel" ]; then
              echo "SKIP absent $rel"
              printf '%s\t0\tabsent\n' "$rel" >> "$TABLE"
              return 0
            fi
            kib="$(du -sk -- "$rel" | awk '{print $1}')"
            echo "TRIM $rel size=$((kib / 1024)) MiB (checked-out files only)"
            rm -rf -- "$rel"
            if [ -e "$rel" ]; then
              echo "::error::Failed to remove $rel"
              return 1
            fi
            printf '%s\t%s\tremoved\n' "$rel" "$kib" >> "$TABLE"
          }

          if [ "${STORAGE_TRIM_DARWIN_HOST_TOOLS}" = 1 ]; then
            if [ -d prebuilts/rust/linux-x86 ] && [ -d prebuilts/clang/host/linux-x86 ]; then
              for rel in \
                prebuilts/rust/darwin-x86 \
                prebuilts/clang-tools/darwin-x86 \
                prebuilts/build-tools/darwin-x86 \
                prebuilts/jdk/jdk8/darwin-x86 \
                prebuilts/jdk/jdk9/darwin-x86 \
                prebuilts/jdk/jdk11/darwin-x86 \
                prebuilts/jdk/jdk17/darwin-x86 \
                prebuilts/jdk/jdk21/darwin-x86; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::Linux host toolchains not found; Darwin trim skipped for safety.'
            fi
          fi

          if [ "${STORAGE_TRIM_OLD_VNDK_ABI}" = 1 ]; then
            root=prebuilts/abi-dumps/vndk
            if [ ! -L "$root" ] && [ -s "$root/Android.bp" ] \
               && [ -d "$root/33" ]; then
              echo 'VNDK ABI trim guard passed: version 33 and Android.bp exist.'
              for rel in \
                prebuilts/abi-dumps/vndk/29 \
                prebuilts/abi-dumps/vndk/30 \
                prebuilts/abi-dumps/vndk/31; do
                trim_known_path "$rel"
              done
            else
              echo '::warning::VNDK ABI layout differs from the expected trim layout; skipping ABI trim.'
            fi
          fi

          test -d prebuilts/rust/linux-x86
          test -d prebuilts/clang/host/linux-x86
          after_bytes="$(df -B1 --output=avail "$PWD" | tail -n1 | tr -d ' ')"
          reclaimed_bytes="$((after_bytes - before_bytes))"
          echo '=== P1 STORAGE RESULT ==='
          echo "disk_available_after_bytes=$after_bytes"
          echo "disk_available_delta_bytes=$reclaimed_bytes"
          df -h "$PWD"
          cat "$TABLE"
          if [ -s "$TS" ]; then
            printf '%s\tpost-worktree-trim\t%s\t%s\t%s\n' \
              "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$after_bytes" \
              "$(df -B1 --output=used "$PWD" | tail -n1 | tr -d ' ')" \
              "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"
          fi

