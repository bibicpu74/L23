      - name: Configure primary Soong Go runtime and heap telemetry
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          python3 - <<'PYGO'
          import pathlib
          import re
          import subprocess
          import os
          import sys

          go = pathlib.Path('prebuilts/go/linux-x86/bin/go').resolve()
          gofmt = pathlib.Path('prebuilts/go/linux-x86/bin/gofmt').resolve()
          target = pathlib.Path('build/soong/cmd/soong_build/main.go')
          log = pathlib.Path('/tmp/rbe-test/soong-go-runtime-patch.txt')
          if not (target.is_file() and go.is_file() and gofmt.is_file()):
              sys.exit('ERROR: Soong main.go or the Go toolchain is missing')
          version = subprocess.check_output([str(go), 'version'], text=True).strip()
          m = re.search(r'\bgo(\d+)\.(\d+)', version)
          if not m or tuple(map(int, m.groups())) < (1, 19):
              sys.exit('ERROR: Go >=1.19 required for debug.SetMemoryLimit')
          gogc = int(os.environ['SOONG_GOGC'])
          maxprocs = int(os.environ['SOONG_GRAPH_GOMAXPROCS'])
          mem = re.fullmatch(r'(\d+)GiB', os.environ['SOONG_GOMEMLIMIT'])
          if not mem or not (1 <= gogc <= 200 and 1 <= maxprocs <= 16):
              sys.exit('ERROR: invalid GC settings')
          mem_bytes = int(mem.group(1)) * 1024**3

          before = target.read_text()
          if before.count('func main() {') != 1 or before.count('import (') != 1:
              sys.exit('ERROR: unexpected Soong main.go layout')
          if 'SOONG_GO_RUNTIME_APPLIED' in before:
              sys.exit('ERROR: Soong main.go is already instrumented')
          for imp in ('runtime', 'runtime/debug', 'time', 'strings', 'fmt', 'os'):
              if f'"{imp}"' not in before:
                  before = before.replace('import (', f'import (\n\t"{imp}"', 1)

          code = fr"""
          func configureSoongGraphRuntimeCI() {{
              graph := false
              for _, arg := range os.Args[1:] {{
                  if arg == "--soong_variables" || arg == "-soong_variables" || strings.HasPrefix(arg, "--soong_variables=") {{
                      graph = true
                      break
                  }}
              }}
              if !graph {{ return }}
              runtime.GOMAXPROCS({maxprocs})
              debug.SetGCPercent({gogc})
              debug.SetMemoryLimit(int64({mem_bytes}))
              fmt.Fprintf(os.Stderr, "SOONG_GO_RUNTIME_APPLIED pid=%d GOGC={gogc} GOMEMLIMIT={mem_bytes}B GOMAXPROCS={maxprocs}\n", os.Getpid())
              out, err := os.OpenFile("/tmp/rbe-test/soong-go-heap.tsv", os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0600)
              if err != nil {{
                  fmt.Fprintf(os.Stderr, "SOONG_GO_TELEMETRY_OPEN_FAILED: %v\n", err)
                  return
              }}
              capture := func() {{
                  var ms runtime.MemStats
                  runtime.ReadMemStats(&ms)
                  fmt.Fprintf(out, "%s\t%d\t%d\t%d\t%d\t%d\t%d\t%d\t%d\n",
                      time.Now().UTC().Format(time.RFC3339), os.Getpid(),
                      ms.HeapAlloc, ms.HeapSys, ms.HeapInuse, ms.HeapReleased,
                      ms.Sys, ms.StackSys, ms.NumGC)
                  out.Sync()
              }}
              capture()
              go func() {{
                  ticker := time.NewTicker(10 * time.Second)
                  defer ticker.Stop()
                  defer out.Close()
                  for range ticker.C {{ capture() }}
              }}()
          }}
          """
          injected = before.replace('func main() {', code + '\nfunc main() {', 1)
          injected = injected.replace('func main() {', 'func main() {\n\tconfigureSoongGraphRuntimeCI()', 1)
          if injected.count('SOONG_GO_RUNTIME_APPLIED') != 1:
              sys.exit('ERROR: failed to inject runtime instrumentation')
          target.write_text(injected)
          subprocess.run([str(gofmt), '-w', str(target)], check=True)
          log.write_text(f'go_version={version}\nsource={target}\n' +
                         f'GOGC={gogc}\nGOMEMLIMIT={mem_bytes}B\nGOMAXPROCS={maxprocs}\n')
          print(log.read_text())
          PYGO

