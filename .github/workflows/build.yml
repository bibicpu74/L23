name: LineageOS Build - starlte Btrfs ZSTD + RBE24

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: "LineageOS branch to sync"
        type: choice
        required: true
        default: lineage-23.2
        options:
          - lineage-23.2
          - lineage-22.2
          - lineage-22.1
          - lineage-22.0
      workspace_storage:
        description: "Android workspace: Btrfs ZSTD (default), or uncompressed plain"
        type: choice
        required: true
        default: btrfs_zstd
        options:
          - btrfs_zstd
          - plain
      debug_info_level:
        description: "Clang C/C++ DWARF: minimal (saves build space), none, or full"
        type: choice
        required: true
        default: debug_level_1
        options:
          - debug_level_1
          - debug_level_0
          - debug_level_g
      btrfs_zstd_level:
        description: "Btrfs workspace ZSTD level; 1 is fastest for OTA packaging"
        type: choice
        required: true
        default: '1'
        options:
          - '1'
          - '3'
      java_rbe_mode:
        description: "P0: enable R8/D8 over BuildBuddy (Javac stays local); off restores original behavior"
        type: choice
        required: true
        default: dex
        options:
          - dex
          - 'off'
      remote_jobs:
        description: "Parallel RBE actions (24 recommended for speed)"
        type: choice
        required: true
        default: '24'
        options:
          - '16'
          - '20'
          - '24'

permissions:
  contents: read

concurrency:
  group: los-starlte-rbe-full-rom-trial
  cancel-in-progress: false

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      LINEAGE_BRANCH: "${{ inputs.lineage_branch }}"
      WORKSPACE_STORAGE: "${{ inputs.workspace_storage }}"
      BTRFS_WORKSPACE_IMAGE_GIB: "220"
      CLANG_DEFAULT_DEBUG_LEVEL: "${{ inputs.debug_info_level || 'debug_level_1' }}"
      BTRFS_ZSTD_LEVEL: "${{ inputs.btrfs_zstd_level || '1' }}"

      # Android / Soong RBE
      # Keep both explicit: Soong dex remote rules require UseREWrapper() in
      # addition to the per-tool RBE_R8 / RBE_D8 feature gates.
      USE_RBE: "true"
      USE_REWRAPPER: "true"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote_local_fallback"
      # P0: R8/D8 are activated only after the source-code preflight below.
      JAVA_RBE_MODE: "${{ inputs.java_rbe_mode || 'dex' }}"
      RBE_R8: "false"
      RBE_D8: "false"
      RBE_JAVAC: "false"
      RBE_R8_EXEC_STRATEGY: "remote_local_fallback"
      RBE_D8_EXEC_STRATEGY: "remote_local_fallback"
      RBE_JAVAC_EXEC_STRATEGY: "local"

      # Loopback Unix Socket -> nginx gRPC TLS proxy with BuildBuddy API key
      RBE_service: "unix:///tmp/buildbuddy-rbe-bridge/grpc.sock"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_gce_credentials: "false"
      RBE_use_rpc_credentials: "false"
      RBE_depsscanner_address: "execrel://"

      # Keep all RBE diagnostics in one place
      RBE_log_dir: "/tmp/rbe-test"
      RBE_proxy_log_dir: "/tmp/rbe-test"
      RBE_output_dir: "/tmp/rbe-test"
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "0"

      # Reclaim Git object stores after graph generation
      SAFE_GIT_OBJECT_TRIM: "1"
      SAFE_GIT_EXTENDED_TRIM: "1"
      RBE_CLOSED_INFO_MAX_MIB: "32"
      RBE_LOG_SCAN_INTERVAL_SAMPLES: "6"
      RBE_INFO_KEEP_MIB: "4"
      RBE_RRPL_KEEP_MIB: "32"

      # RBE & Ninja concurrency
      NINJA_REMOTE_NUM_JOBS: "${{ inputs.remote_jobs || '24' }}"
      NINJA_HIGHMEM_NUM_JOBS: "1"
      LOCAL_NINJA_JOBS: "3"

      # Soong Go GC tuning for graph generation
      SOONG_GOGC: "45"
      SOONG_GOMEMLIMIT: "6GiB"
      SOONG_GRAPH_GOMAXPROCS: "2"
      SOONG_GRAPH_GC_TRACE: "1"
      SOONG_GRAPH_GC_TAIL_LINES: "200"
      GRAPH_MEM_GUARD_ENABLED: "1"
      GRAPH_MEM_GUARD_RAM_MIB: "1024"
      GRAPH_MEM_GUARD_SWAP_MIB: "1536"
      GRAPH_MEM_GUARD_SAMPLES: "3"

      # Hybrid memory: Keep full 12 GiB disk swap + 8 GiB ZRAM throughout the entire ROM build!
      SOONG_ZRAM_GIB: "8"
      SOONG_DISK_SWAP_GIB: "12"
      POST_GRAPH_DISK_SWAP_GIB: "12"
      SOONG_SWAP_DISK_RESERVE_GIB: "10"

      # P1 worktree storage trim
      STORAGE_TRIM_DARWIN_HOST_TOOLS: "1"
      STORAGE_TRIM_OLD_VNDK_ABI: "1"

      # Disk & time safety thresholds (350m leaves 10m buffer for artifact upload)
      DISK_WARN_GIB: "8"
      DISK_STOP_GIB: "0"
      FULL_ROM_SOFT_DEADLINE_MINUTES: "350"

    steps:
      - name: Reclaim root disk
        shell: bash
        run: |
          set -e
          sudo swapoff -a || true
          sudo rm -f /swapfile /build-swap /mnt/swapfile || true
          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true

          sudo rm -rf \
            /var/lib/docker \
            /var/lib/containerd \
            /var/cache/apt/archives/* \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/graalvm \
            /usr/share/rust \
            /usr/share/php* \
            /usr/local/share/chromium \
            /usr/share/miniconda \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/share/vcpkg \
            /opt/google \
            /opt/microsoft \
            /usr/share/postgresql \
            /usr/share/mysql \
            /usr/local/julia* || true

          mkdir -p /home/runner/work/los /tmp/rbe-test
          date +%s > /tmp/rbe-test/job-start-epoch.txt

          echo "=== DISK ==="
          df -h /
          echo "=== MEMORY ==="
          free -h
          echo "=== CPU ==="
          nproc

          TS=/tmp/rbe-test/resource-samples.tsv
          printf 'timestamp\tstage\tdisk_available_bytes\tdisk_used_bytes\tmem_available_kib\n' > "$TS"
          printf '%s\tpost-reclaim\t%s\t%s\t%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "$(df -B1 --output=avail / | tail -n1 | tr -d ' ')" \
            "$(df -B1 --output=used / | tail -n1 | tr -d ' ')" \
            "$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)" >> "$TS"

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            btrfs-progs \
            xsltproc \
            zip \
            zlib1g-dev \
            zstd \
            python3 \
            python-is-python3 \
            openjdk-21-jdk-headless \
            ninja-build \
            nginx \
            ca-certificates \
            openssl \
            unzip \
            linux-modules-extra-$(uname -r) || true

          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate BuildBuddy secret
        shell: bash
        run: |
          set -e
          if [ -z "${BUILDBUDDY_API_KEY:-}" ]; then
            echo "::error::BUILDBUDDY_API_KEY secret is missing."
            exit 1
          fi

      - name: Mount compressed Btrfs ZSTD workspace before repo sync
        if: ${{ inputs.workspace_storage == 'btrfs_zstd' }}
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=/home/runner/work/los
          BACKING=/tmp/los-workspace-btrfs.img
          mkdir -p /tmp/rbe-test "$WORKSPACE"
          if mountpoint -q "$WORKSPACE" || [ -n "$(ls -A "$WORKSPACE")" ]; then
            echo '::error::Android workspace must be empty before Btrfs setup.'
            exit 1
          fi
          truncate -s "${BTRFS_WORKSPACE_IMAGE_GIB}G" "$BACKING"
          sudo mkfs.btrfs -f -m single -d single "$BACKING" \
            > /tmp/rbe-test/btrfs-mkfs.log 2>&1
          case "$BTRFS_ZSTD_LEVEL" in 1|3) ;; *) echo '::error::Unsupported ZSTD level'; exit 1 ;; esac
          sudo mount -t btrfs -o "loop,compress=zstd:${BTRFS_ZSTD_LEVEL},noatime" \
            "$BACKING" "$WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$WORKSPACE"
          test "$(stat -f -c '%T' "$WORKSPACE")" = btrfs
          echo "=== ANDROID (${LINEAGE_BRANCH}) FULL WORKSPACE ZSTD ==="
          findmnt -T "$WORKSPACE" -o SOURCE,FSTYPE,OPTIONS
          df -hT / "$WORKSPACE"
          du -h "$BACKING"
          printf 'timestamp\tstage\troot_free_bytes\tbtrfs_free_bytes\timage_allocated_bytes\n' \
            > /tmp/rbe-test/btrfs-storage-samples.tsv
          root_free="$(df -B1 --output=avail / | tail -n1 | tr -d ' ')"
          if (( root_free < DISK_STOP_GIB * 1073741824 )); then
            echo "::error::Host root disk below ${DISK_STOP_GIB} GiB after Btrfs mount."
            exit 70
          fi

      - name: Relocate CI and reproxy diagnostics into Android workspace
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          DST=/home/runner/work/los/rbe-diagnostics
          test -d /home/runner/work/los
          mkdir -p "$DST"
          if [ -L /tmp/rbe-test ]; then
            test "$(readlink -f /tmp/rbe-test)" = "$DST"
          else
            test -d /tmp/rbe-test
            cp -a /tmp/rbe-test/. "$DST/"
            rm -rf -- /tmp/rbe-test
            ln -s "$DST" /tmp/rbe-test
          fi
          echo "diagnostic_realpath=$(readlink -f /tmp/rbe-test)" > /tmp/rbe-test/diagnostic-location.txt
          REAL_DIAG="$(readlink -f /tmp/rbe-test)"
          test "$REAL_DIAG" = "$DST"
          echo "diag_bytes=$(du -sk "$REAL_DIAG" | awk '{print $1*1024}')"
          df -hT / "$DST"
          findmnt -T "$DST" -o SOURCE,FSTYPE,OPTIONS
          echo 'Reproxy diagnostics are now stored in the Android workspace.'

      - name: Repo init and install local manifest
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e

          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          git lfs version
          git lfs install --skip-repo

          mkdir -p /home/runner/work/los
          cd /home/runner/work/los
          if [ "$WORKSPACE_STORAGE" = btrfs_zstd ]; then
            mountpoint -q "$PWD" || { echo '::error::Btrfs mount missing before repo init.'; exit 1; }
            test "$(stat -f -c '%T' "$PWD")" = btrfs
          fi

          repo init \
            --depth=1 \
            --git-lfs \
            -u https://github.com/LineageOS/android.git \
            -b "${LINEAGE_BRANCH}"

          mkdir -p .repo/local_manifests

          if [ -s "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/starlte.xml" ]; then
            MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/starlte.xml"
            MANIFEST_DST=".repo/local_manifests/starlte.xml"
          elif [ -s "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml" ]; then
            MANIFEST_SRC="$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml"
            MANIFEST_DST=".repo/local_manifests/star2lte.xml"
          else
            echo "::error::Local manifest not found in $GITHUB_WORKSPACE/repo-config/.repo-local-manifests/"
            exit 1
          fi

          cp "$MANIFEST_SRC" "$MANIFEST_DST"

          echo "=== P0 RECLIENT PROJECT BEFORE TRIM ==="
          repo list -a -p > /tmp/rbe-test/manifest-projects-before-trim.txt
          if ! grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-before-trim.txt; then
            echo "::error::Expected remoteexecution-client project is missing from the manifest; review before trimming."
            exit 1
          fi

          repo manifest -o /tmp/rbe-test/pre-storage-trim-manifest.xml
          python3 - <<'PYHOSTTRIM'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tree=ET.parse('/tmp/rbe-test/pre-storage-trim-manifest.xml')
          seen={p.get('path',p.get('name')):p.get('name')
                for p in tree.getroot().findall('.//project')}
          targets=['prebuilts/remoteexecution-client',
                   'prebuilts/clang/host/darwin-x86',
                   'prebuilts/android-emulator',
                   'prebuilts/bazel/darwin-x86_64',
                   'prebuilts/go/darwin-x86']
          if 'prebuilts/remoteexecution-client' not in seen:
              raise SystemExit('Required RBE project not found before trim')
          root=ET.Element('manifest')
          for target in targets:
              name=seen.get(target)
              if name:
                  ET.SubElement(root,'remove-project',{'name':name,'optional':'true'})
                  print(f'Safe manifest removal: {target} -> {name}')
              else:
                  print(f'Already absent from manifest: {target}')
          out=Path('.repo/local_manifests/zz-storage-trim.xml')
          ET.indent(root,space='    ')
          ET.ElementTree(root).write(out,encoding='UTF-8',xml_declaration=True)
          PYHOSTTRIM

          repo list -a -p > /tmp/rbe-test/manifest-projects-after-trim.txt
          if grep -Fxq 'prebuilts/remoteexecution-client' \
            /tmp/rbe-test/manifest-projects-after-trim.txt; then
            echo "::error::P0 trim failed: reclient project is still in the effective manifest."
            exit 1
          fi
          repo manifest -o /tmp/rbe-test/effective-manifest-after-trim.xml
          echo 'P0 trim verified: prebuilts/remoteexecution-client will NOT be repo-synced.' \
            | tee /tmp/rbe-test/p0-storage-trim-status.txt

          echo '=== VERIFY STORAGE PROJECT REMOVALS (EFFECTIVE MANIFEST) ==='
          for removed in \
            prebuilts/clang/host/darwin-x86 \
            prebuilts/android-emulator \
            prebuilts/bazel/darwin-x86_64 \
            prebuilts/go/darwin-x86; do
            if grep -Fxq "$removed" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Expected removed project is still present: $removed"
              exit 1
            fi
            echo "Removed from repo sync: $removed"
          done
          for required in \
            device/samsung/starlte \
            device/samsung/exynos9810-common \
            device/samsung_slsi/sepolicy \
            kernel/samsung/exynos9810 \
            vendor/samsung/starlte \
            vendor/samsung/exynos9810-common \
            hardware/samsung; do
            if ! grep -Fxq "$required" /tmp/rbe-test/manifest-projects-after-trim.txt; then
              echo "::error::Missing required device/vendor project: $required"
              exit 1
            fi
          done

          echo "=== LOCAL MANIFEST ==="
          sed -n '1,260p' "$MANIFEST_DST"
          echo "=== P0 STORAGE TRIM MANIFEST ==="
          cat .repo/local_manifests/zz-storage-trim.xml

      - name: Repo sync
        working-directory: /home/runner/work/los
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail

          (
            while true; do
              echo "=== RESOURCE SNAPSHOT ==="
              df -h / | tail -1
              free -h | head -2
              sleep 30
            done
          ) &
          MONPID=$!
          trap 'kill "$MONPID" 2>/dev/null || true' EXIT

          if ! repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j"$(nproc)"; then
            echo "::warning::Parallel repo sync failed; retrying with -j4."
            repo sync \
              -c \
              --no-clone-bundle \
              --no-tags \
              --prune \
              -j4
          fi

          echo "=== POST-SYNC DISK ==="
          df -h / /home/runner/work/los

      - name: Capture locked source manifest before checkout modifications
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          FILE=/tmp/rbe-test/source-manifest-locked.xml
          repo manifest -r -o "$FILE"
          python3 - "$FILE" <<'PYLOCK'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          projects=root.findall('.//project')
          if root.tag != 'manifest' or len(projects) < 100:
              raise SystemExit('Locked manifest unexpectedly empty or too small')
          bad=[p.get('path') or p.get('name') for p in projects
               if not p.get('revision')]
          if bad: raise SystemExit('Missing pinned revision: '+str(bad[:5]))
          print(f'Locked source manifest contains {len(projects)} projects')
          PYLOCK
          sha256sum "$FILE" > /tmp/rbe-test/source-manifest-locked.sha256

      - name: Sonivox ARM preflight and narrowly guarded source fix
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          SRC=external/sonivox/arm-wt-22k/lib_src
          INC="$SRC/ARM_synth_constants_gnu.inc"
          LOG=/tmp/rbe-test/sonivox-preflight.log
          mkdir -p /tmp/rbe-test
          exec > >(tee "$LOG") 2>&1
          test -s "$INC"

          CLANG="$(find prebuilts/clang/host/linux-x86 -maxdepth 3 -type f -path '*/clang-r*/bin/clang' | sort -V | tail -n1)"
          if [ -z "$CLANG" ] || [ ! -x "$CLANG" ]; then
            echo "::error::Could not locate host Clang binary under prebuilts/clang/host/linux-x86"
            exit 1
          fi
          echo "Using host Clang for Sonivox preflight: $CLANG"

          echo '=== SONIVOX SOURCE CHECK, LINE 70-115 ==='
          nl -ba "$INC" | sed -n '70,115p'
          python3 - "$INC" <<'PYSONIVOX'
          from pathlib import Path
          import sys, re, difflib
          path = Path(sys.argv[1]); orig = path.read_text()
          lines = orig.splitlines(keepends=True)
          depth = 0; orphans = []
          for i, line in enumerate(lines):
              if re.match(r'^\s*#\s*(?:if|ifdef|ifndef)\b',line):
                  depth += 1
              elif re.match(r'^\s*#\s*endif\b',line):
                  if depth: depth -= 1
                  else: orphans.append(i)
          print('orphan_cpp_endif_lines=', [i+1 for i in orphans])
          if not orphans:
              print('No unmatched #endif; no patch needed')
              sys.exit(0)
          if len(orphans) != 1 or orphans[0] != 97:
              sys.exit('Unexpected Sonivox CPP imbalance; refuse speculative patch')
          i = orphans[0]
          if not re.fullmatch(r'\s*#\s*endif\s*(?:\r?\n)?',lines[i]):
              sys.exit('Unexpected line 98 content; refusing patch')
          if not any(re.match(r'^\s*\.if\b',lines[j]) for j in range(max(0,i-60),i)):
              sys.exit('No nearby assembler .if to match; refusing patch')
          lines[i] = re.sub(r'#\s*endif', '.endif', lines[i], count=1)
          repaired=''.join(lines)
          for ln in difflib.unified_diff(orig.splitlines(True),repaired.splitlines(True),fromfile='original',tofile='sonivox-guarded-fix'):
              print(ln,end='')
          path.write_text(repaired)
          PYSONIVOX
          echo '=== REAL CLANG CPP VALIDATION ==='
          for name in ARM-E_filter_gnu ARM-E_mastergain_gnu; do
            "$CLANG" -E -x assembler-with-cpp -target armv7a-linux-androideabi10000 \
              -I"$SRC" "$SRC/$name.s" \
              -o "/tmp/rbe-test/${name}.preprocessed.s"
            test -s "/tmp/rbe-test/${name}.preprocessed.s"
          done
          git -C external/sonivox diff -- arm-wt-22k/lib_src/ARM_synth_constants_gnu.inc \
            > /tmp/rbe-test/sonivox-fix.patch || true
          echo 'SONIVOX_CPP_PREFLIGHT_PASSED'

      - name: Fix Exynos 9810 SoundBooster effect flag for Android 15/16
        working-directory: /home/runner/work/los
        shell: bash
        run: |
          set -euo pipefail
          FILE="device/samsung/exynos9810-common/audio/soundbooster/SoundBoosterEffect.cpp"
          
          if [ -f "$FILE" ]; then
            if grep -q "EFFECT_FLAG_NOT_ELIGIBLE_SUSPEND" "$FILE"; then
              sed -i 's/EFFECT_FLAG_NOT_ELIGIBLE_SUSPEND/0/g' "$FILE"
              echo "Successfully patched EFFECT_FLAG_NOT_ELIGIBLE_SUSPEND in $FILE"
              git -C device/samsung/exynos9810-common diff > /tmp/rbe-test/audio-soundbooster-fix.patch || true
            else
              echo "Flag not found or already patched."
            fi
          else
            echo "SoundBoosterEffect.cpp not found; skipping."
          fi

      - name: Resolve and validate Chromium WebView arm64 Git LFS
        working-directory: /home/runner/work/los
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p /tmp/rbe-test
          LOG=/tmp/rbe-test/webview-lfs-check.log
          APK=external/chromium-webview/prebuilt/arm64/webview.apk
          DIR="$(dirname "$APK")"
          {
            echo '=== GIT LFS ==='
            git lfs version
            echo '=== WEBVIEW LFS PROJECTS ==='
            repo list -a -p | grep -E '^external/chromium-webview(/|$)' || true
          } | tee "$LOG"

          if [ ! -e "$APK" ]; then
            if repo list -a -p | grep -Fxq "$DIR"; then
              echo "::error::WebView arm64 project exists, but APK missing: $APK" | tee -a "$LOG"
              exit 1
            fi
            echo "WebView APK absent at $APK; this manifest may use another WebView source." | tee -a "$LOG"
            exit 0
          fi

          REPO_ROOT="$(git -C "$DIR" rev-parse --show-toplevel)"
          REL_APK="$(realpath --relative-to="$REPO_ROOT" "$PWD/$APK")"
          {
            echo "git_root=$REPO_ROOT"
            echo "git_relative_apk=$REL_APK"
            echo "original_size_bytes=$(stat -c %s "$APK")"
            git -C "$REPO_ROOT" lfs ls-files --long | grep -F 'webview.apk' || true
          } | tee -a "$LOG"
          if [[ "$(head -c 96 "$APK")" == 'version https://git-lfs.github.com/spec/v1'* ]]; then
            echo 'Detected Git LFS pointer; fetching the exact checkout revision.' | tee -a "$LOG"
            git -C "$REPO_ROOT" lfs pull --include="$REL_APK" --exclude='' \
              2>&1 | tee /tmp/rbe-test/webview-lfs-pull.log
            git -C "$REPO_ROOT" lfs checkout "$REL_APK" \
              2>&1 | tee -a /tmp/rbe-test/webview-lfs-pull.log
          fi
          python3 - "$APK" <<'PYWEBVIEW'
          import pathlib,sys,zipfile
          file=pathlib.Path(sys.argv[1])
          with file.open('rb') as f: prefix=f.read(256)
          if prefix.startswith(b'version https://git-lfs.github.com/spec/v1'):
              sys.exit('ERROR: WebView APK is still an LFS pointer')
          if file.stat().st_size < 10 * 1024 * 1024 or prefix[:2] != b'PK':
              sys.exit('ERROR: WebView prebuilt is too small or not an APK/ZIP')
          with zipfile.ZipFile(file) as apk:
              if 'AndroidManifest.xml' not in apk.namelist():
                  sys.exit('ERROR: WebView APK missing AndroidManifest.xml')
              print(f'WebView arm64 APK verified; bytes={file.stat().st_size}')
          PYWEBVIEW
          echo '=== WEBVIEW APK ZIP CRC CHECK ===' | tee -a "$LOG"
          unzip -tqq "$APK" | tee /tmp/rbe-test/webview-unzip-test.txt
          sha256sum "$APK" | tee /tmp/rbe-test/webview-sha256.txt
          echo 'WebView LFS preflight passed.' | tee -a "$LOG"

